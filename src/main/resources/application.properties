# ===================================================================
# Application Configuration: CCN_PKI (Public Key Infrastructure MVP)
# Developed for ENSET Mohammedia - Confiance Numérique & Accès Biométrique
# ===================================================================

spring.application.name=CCN_PKI
server.port=8080

# Logging Configuration
logging.level.com.ccn.pki=INFO
logging.level.org.springframework=WARN

# H2 Database Persistence Configuration (persisted to file in pki-data directory)
spring.datasource.url=jdbc:h2:file:./pki-data/db/pkidb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (accessible at /h2-console for administrative inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File upload limit for CSR and Certificate verification
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PKI Configuration Properties
pki.storage.base-dir=./pki-data
pki.ca.default-dn=CN=CCN Root CA, OU=Laboratoire Securite, O=ENSET Mohammedia, C=MA
pki.ca.validity-years=10
pki.ca.key-size=4096
pki.cert.default-validity-days=365
pki.crl.validity-days=30
pki.crl.distribution-point=http://localhost:8080/api/pki/crl/download
