spring.application.name=CCN_PKI_TEST

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

pki.storage.base-dir=./target/test-pki-data
pki.ca.default-dn=CN=Test CCN Root CA, OU=Security Lab, O=ENSET Mohammedia, C=MA
pki.ca.validity-years=10
pki.ca.key-size=2048
pki.cert.default-validity-days=365
pki.crl.validity-days=30
pki.crl.distribution-point=http://localhost:8080/api/pki/crl/download
